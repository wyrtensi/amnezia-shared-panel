name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  panel:
    name: Panel (lint, typecheck, build, test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: amnezia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/amnezia
      TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/amnezia
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - name: Apply database migrations
        run: pnpm --filter @amnezia/db db:migrate
      - name: Run tests (unit + DB-gated integration)
        # Serialize packages so control-api and worker never share the test
        # database concurrently (their integration suites each reset tables).
        run: pnpm -r --workspace-concurrency=1 --if-present test

  node-agent:
    name: Node agent (test, openapi)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/node-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run openapi:check

  infra:
    name: Infra and rollout script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test infra/node/tests/*.mjs scripts/tests/*.mjs
