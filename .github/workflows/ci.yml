name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  panel:
    name: Panel (lint, typecheck, build, test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: amnezia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/amnezia
      TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/amnezia
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - name: Apply database migrations
        run: pnpm --filter @amnezia/db db:migrate
      - name: Run tests (unit + DB-gated integration)
        # Serialize packages so control-api and worker never share the test
        # database concurrently (their integration suites each reset tables).
        run: pnpm -r --workspace-concurrency=1 --if-present test

  node-agent:
    name: Node agent (test, openapi)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/node-agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run openapi:check

  reachability-probe:
    name: Reachability probe (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/reachability-probe
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: npm run build

  bridge-agent:
    name: Bridge agent (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/bridge-agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: npm run build
      # The release workflow builds this same Dockerfile on a tag; build it
      # here (no push) so a broken image is found on the branch, not at release.
      - name: Build the image
        working-directory: .
        run: docker build services/bridge-agent --tag bridge-agent:ci

  infra:
    name: Infra and rollout script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: ShellCheck bridge scripts (installers, bridge-agent updater) and the frpc installer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -s sh infra/bridge/install-bridge.sh infra/bridge/install-frps.sh infra/node/scripts/install-frpc.sh scripts/add-bridge-tunnel.sh
          shellcheck -s bash infra/bridge/bridge-agent-update.sh
      - run: node --test infra/node/tests/*.mjs infra/bridge/tests/*.mjs infra/prod/tests/*.mjs scripts/tests/*.mjs
