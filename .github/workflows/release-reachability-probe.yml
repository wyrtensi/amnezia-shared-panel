name: Release reachability-probe image

# Build the reachability probe image on GitHub runners and push it to GHCR, so
# the probe host pulls (or loads) a pinned digest instead of building.
#
# Separate workflow, separate tag: services/reachability-probe is versioned on
# its own and lives outside the pnpm workspace, like services/node-agent.
on:
  push:
    tags: ["reachability-probe-v*"]
  workflow_dispatch:

concurrency:
  group: release-reachability-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build & push reachability-probe (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The probe's own version. On a manual run there is no tag to read, so
      # fall back to the short sha - still immutable, still never "latest".
      - name: Image tag
        id: version
        run: |
          ref="${GITHUB_REF_NAME}"
          case "$ref" in
            reachability-probe-v*) version="${ref#reachability-probe-v}" ;;
            *) version="sha-${GITHUB_SHA::12}" ;;
          esac
          echo "value=$version" >> "$GITHUB_OUTPUT"

      # Deliberately NO `latest` tag: compose requires a sha256-pinned image.
      - name: Build & push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: services/reachability-probe
          file: services/reachability-probe/Dockerfile
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository }}/reachability-probe:${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report the pinned reference
        run: |
          {
            echo "## reachability-probe image published"
            echo
            echo "Put this in the probe host's \`.env\`, then run \`docker compose up -d\`:"
            echo
            echo '```'
            echo "PROBE_IMAGE=ghcr.io/${{ github.repository }}/reachability-probe@${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
