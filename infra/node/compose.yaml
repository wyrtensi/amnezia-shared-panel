name: amnezia-node

services:
  awg2:
    # AWG 2.0 is opt-in. A node created today serves AWG 3.1 only; awg2 exists
    # for nodes that still carry legacy peers, and is started only when
    # PROTOCOLS_ENABLED names amneziawg2 (see scripts/common.sh: awg2_enabled).
    profiles:
      - awg2
    container_name: amnezia-awg2
    image: amneziavpn/amneziawg-go:0.2.19@sha256:3c78eb57ef5cb44f63aed185e79c104593c854a5ebde3e1075470301bcc77c44
    platform: linux/amd64
    pull_policy: never
    init: true
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - /usr/local/libexec/awg2-entrypoint.sh
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.conf.all.src_valid_mark: "1"
      net.ipv4.ip_forward: "1"
    ports:
      - "51889:51889/udp"
    volumes:
      - ./state/amnezia-awg2:/opt/amnezia/awg
      - ./scripts/awg2-entrypoint.sh:/usr/local/libexec/awg2-entrypoint.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -s /opt/amnezia/awg/awg0.conf &&
          test -s /opt/amnezia/awg/wireguard_server_public_key.key &&
          test -r /opt/amnezia/awg/clientsTable &&
          awg show awg0 >/dev/null 2>&1
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 6
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  awg3:
    container_name: amnezia-awg3
    image: amneziavpn/amneziawg-go:3.1.20260814@sha256:4450928744b051589bb3ba5cf6dd0cd8d7dc470b9432dc32d03d5ff5ede11b7a
    platform: linux/amd64
    pull_policy: never
    init: true
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - /usr/local/libexec/awg3-entrypoint.sh
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.conf.all.src_valid_mark: "1"
      net.ipv4.ip_forward: "1"
    ports:
      - "51890:51890/udp"
    volumes:
      - ./state/amnezia-awg3:/opt/amnezia/awg
      - ./scripts/awg3-entrypoint.sh:/usr/local/libexec/awg3-entrypoint.sh:ro
      - ./scripts/awg3-geometry.sh:/usr/local/libexec/awg3-geometry.sh:ro
    environment:
      # Read once, at first initialization, by awg3-geometry.sh.
      #
      # DisableCookies is an availability posture rather than obfuscation
      # entropy, which is why it is a knob and not randomised. `on` (upstream's
      # own client default) keeps the node silent to unauthenticated probes -
      # a cookie reply is a distinctive artefact an active prober can elicit -
      # at the cost of WireGuard's per-source rate limiter under load. Set it
      # to `off` on a node where availability matters more than silence.
      AWG3_DISABLE_COOKIES: ${AWG3_DISABLE_COOKIES:-on}
      # The awg0 interface MTU. S4 comes out of the same budget, and the
      # entrypoint sizes the interface from this same value - so this default
      # MUST equal the entrypoint's. They disagreed once (1376 here, 1420
      # there) and the generator sized S4 for a smaller packet than the
      # interface actually carries, putting 1512 bytes on a 1500-byte path.
      AWG3_TUNNEL_MTU: ${AWG3_TUNNEL_MTU:-1420}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -s /opt/amnezia/awg/awg0.conf &&
          test -s /opt/amnezia/awg/wireguard_server_public_key.key &&
          test -r /opt/amnezia/awg/clientsTable &&
          awg show awg0 >/dev/null 2>&1
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 6
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  node-agent:
    container_name: amnezia-node-agent
    image: ${NODE_AGENT_IMAGE:?NODE_AGENT_IMAGE must be an immutable sha256 image ID or digest reference}
    platform: linux/amd64
    pull_policy: never
    init: true
    user: "10001:0"
    restart: unless-stopped
    # Only awg3. While this also named awg2, a 3.1-only node could not start
    # its agent without someone first bringing up a protocol the node does not
    # serve - which had to be done by hand on a live host.
    depends_on:
      awg3:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        api_key="$$(cat /run/secrets/node_agent_api_key)"
        if [ "$${#api_key}" -lt 32 ]; then
          echo "node-agent API key must contain at least 32 bytes" >&2
          exit 1
        fi
        export FASTIFY_API_KEY="$$api_key"
        unset api_key
        exec node dist/main.js
    environment:
      FASTIFY_ROUTES: "0.0.0.0:4001"
      ENV: production
      DOCKER_API_VERSION: ${DOCKER_API_VERSION:-1.44}
      CORS_ORIGINS: ""
      # The single switch: it tells the agent what to manage AND decides
      # whether the awg2 profile is started. Two flags could disagree, and the
      # failure mode of that is an agent managing a protocol that is not up.
      PROTOCOLS_ENABLED: ${PROTOCOLS_ENABLED:-amneziawg3}
      SERVER_ID: ${SERVER_ID:?SERVER_ID is required}
      SERVER_NAME: ${SERVER_NAME:?SERVER_NAME is required}
      SERVER_REGION: ${SERVER_REGION:?SERVER_REGION is required}
      SERVER_WEIGHT: ${SERVER_WEIGHT:-100}
      SERVER_MAX_PEERS: ${SERVER_MAX_PEERS:-500}
      SERVER_PUBLIC_HOST: ${SERVER_PUBLIC_HOST:?SERVER_PUBLIC_HOST is required}
      # The in-panel "update this node's agent" button is off unless a host is
      # deliberately wired for it: without a repository the agent refuses every
      # update request, so an existing node gains nothing until an operator runs
      # scripts/install-agent-updater.sh. Only a digest inside this repository
      # is ever accepted - a tag is mutable, so what the admin confirmed would
      # not be what the node installs.
      NODE_AGENT_UPDATE_REPO: ${NODE_AGENT_UPDATE_REPO:-}
      NODE_AGENT_UPDATE_SPOOL: /var/lib/node-agent/update
    secrets:
      - source: node_agent_api_key
        target: node_agent_api_key
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # The update spool. The agent writes a request here; the host-side
      # amnezia-node-agent-update.path unit picks it up and does the swap,
      # because the agent cannot durably replace itself (it cannot read this
      # compose file or write .env, and .env is what preflight validates).
      - ${NODE_UPDATE_SPOOL_DIR:-/var/lib/amnezia-node/update}:/var/lib/node-agent/update
    group_add:
      - ${DOCKER_GID:?DOCKER_GID is required}
    ports:
      - "127.0.0.1:4001:4001/tcp"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 6
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

secrets:
  node_agent_api_key:
    file: ./secrets/node-agent-api-key
