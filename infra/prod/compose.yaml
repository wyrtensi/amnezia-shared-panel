name: amnezia-panel

# Production stack. Self-contained (does NOT reuse infra/dev) so the published
# host ports and identity are production values, not dev ones.
#
# CO-LOCATION: the panel can run on the SAME machine as an Amnezia node
# (node-agent + AWG containers). The app services get a host.docker.internal
# route so they can reach a node-agent listening on the host (e.g. 127.0.0.1:4001)
# — register that node with apiBaseUrl http://host.docker.internal:4001.
#
# NON-CONFLICTING PORTS: only web + control-api publish to the host, on LOOPBACK
# and on uncommon ports (5430 / 5431 by default, override via .env). Postgres is
# never published. Change WEB_PUBLISH_PORT / CONTROL_API_PUBLISH_PORT freely if
# they clash with anything else on the box.
x-app: &app
  build:
    context: ../..
    dockerfile: infra/dev/Dockerfile
  image: ${PANEL_IMAGE:-amnezia-panel/app:dev}
  restart: unless-stopped
  env_file:
    - .env
  networks:
    - panel
  # Reach a node-agent running directly on the host (co-located Amnezia node).
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    # Memory ceiling so a co-located node's VPN containers can never be OOM-killed
    # by the panel — the panel restarts itself instead. Tune via env on tiny boxes.
    mem_limit: ${POSTGRES_MEM_LIMIT:-192m}
    environment:
      POSTGRES_DB: amnezia_panel
      POSTGRES_USER: amnezia_panel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amnezia_panel -d amnezia_panel"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - panel

  migrate:
    <<: *app
    restart: "no"
    command: ["pnpm", "--filter", "@amnezia/db", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  control-api:
    <<: *app
    command: ["node", "apps/control-api/dist/main.js"]
    mem_limit: ${CONTROL_API_MEM_LIMIT:-160m}
    environment:
      NODE_ENV: production
      CONTROL_API_HOST: 0.0.0.0
      CONTROL_API_PORT: 3001
      # Cloudflare Access — required in production (main.ts throws without them).
      CF_ACCESS_ISSUER: ${CF_ACCESS_ISSUER}
      CF_ACCESS_AUDIENCE: ${CF_ACCESS_AUDIENCE}
      # First login by these emails is provisioned as admin.
      BOOTSTRAP_ADMIN_EMAILS: ${BOOTSTRAP_ADMIN_EMAILS}
    # Loopback + uncommon host port (control-api is internal; exposed only for
    # local debugging / the co-located CLI).
    ports:
      - "127.0.0.1:${CONTROL_API_PUBLISH_PORT:-5431}:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12

  worker:
    <<: *app
    command: ["node", "apps/worker/dist/main.js"]
    mem_limit: ${WORKER_MEM_LIMIT:-160m}
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    <<: *app
    command: ["pnpm", "--filter", "@amnezia/web", "start"]
    mem_limit: ${WEB_MEM_LIMIT:-320m}
    environment:
      CONTROL_API_URL: http://control-api:3001
      # No dev identity: the web forwards only the real Cloudflare Access JWT.
      HOSTNAME: 0.0.0.0
      PORT: 3000
    # Loopback + uncommon host port. The Cloudflare Tunnel routes to THIS.
    ports:
      - "127.0.0.1:${WEB_PUBLISH_PORT:-5430}:3000"
    depends_on:
      control-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 3s
      retries: 12

volumes:
  postgres-data:

networks:
  panel:
