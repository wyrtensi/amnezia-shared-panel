name: amnezia-panel

# Production stack. Self-contained (does NOT reuse infra/dev) so the published
# host ports and identity are production values, not dev ones.
#
# CO-LOCATION: the panel can run on the SAME machine as an Amnezia node
# (node-agent + AWG containers). The app services get a host.docker.internal
# route so they can reach a node-agent listening on the host (e.g. 127.0.0.1:4001)
# — register that node with apiBaseUrl http://host.docker.internal:4001.
#
# NON-CONFLICTING PORTS: only web + control-api publish to the host, on LOOPBACK
# and on uncommon ports (5430 / 5431 by default, override via .env). Postgres is
# never published. Change WEB_PUBLISH_PORT / CONTROL_API_PUBLISH_PORT freely if
# they clash with anything else on the box.
x-app: &app
  build:
    context: ../..
    dockerfile: infra/dev/Dockerfile
  image: ${PANEL_IMAGE:-amnezia-panel/app:dev}
  restart: unless-stopped
  # PID 1 in these containers is pnpm/node, which never reaps adopted children.
  # Docker's healthchecks run a busybox `wget` that forks an `ssl_client`
  # helper; when wget exits the helper is reparented to PID 1 and stays a
  # zombie. That is one leaked task every healthcheck interval, forever.
  init: true
  # Containment for the same class of leak. Without this the container inherits
  # systemd's DefaultTasksMax, which is a percentage of kernel.threads-max —
  # and threads-max scales with host RAM, so on a small box a leaking container
  # exhausts the host's task budget instead of its own. Steady state is ~25
  # tasks per service.
  pids_limit: ${PANEL_PIDS_LIMIT:-256}
  env_file:
    - .env
  networks:
    - panel
  # Reach a node-agent running directly on the host (co-located Amnezia node).
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    init: true
    pids_limit: ${POSTGRES_PIDS_LIMIT:-256}
    # Memory ceiling so a co-located node's VPN containers can never be OOM-killed
    # by the panel — the panel restarts itself instead. Tune via env on tiny boxes.
    mem_limit: ${POSTGRES_MEM_LIMIT:-192m}
    # Engine settings sized for that ceiling. Stock Postgres asks for 128MB of
    # shared_buffers and allows 100 backends that can each claim work_mem, which
    # is a delayed OOM inside a 192MiB cgroup rather than a protection. Raise all
    # of these through .env on a host with memory to spare.
    command:
      - postgres
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-32MB}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-2MB}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-32MB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-128MB}
      # Connections are opened by the panel's own processes, never by panel
      # users or by nodes: packages/db/src/client.ts opens a pool of `max: 10`
      # per process, and control-api, worker, a transient migrate and the
      # co-located CLI are the only ones that connect. Structural worst case is
      # therefore ~40 plus Postgres's 3 reserved superuser slots. 70 leaves room
      # for a second CLI, a stuck migrate, or an extra process added later.
      # Unused slots cost only a small fixed allocation in shared memory — the
      # per-backend cost is paid when a backend actually connects, and nothing
      # in the panel can open 70 of them.
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-70}
    environment:
      POSTGRES_DB: amnezia_panel
      POSTGRES_USER: amnezia_panel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amnezia_panel -d amnezia_panel"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - panel

  migrate:
    <<: *app
    restart: "no"
    # Run the compiled migrator (no tsx) so the runtime image can drop dev deps.
    # cd into the package so drizzle's "./migrations" folder resolves.
    command: ["sh", "-c", "cd packages/db && node dist/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy

  control-api:
    <<: *app
    command: ["node", "apps/control-api/dist/main.js"]
    mem_limit: ${CONTROL_API_MEM_LIMIT:-160m}
    environment:
      NODE_ENV: production
      CONTROL_API_HOST: 0.0.0.0
      CONTROL_API_PORT: 3001
      # Cloudflare Access — required in production (main.ts throws without them).
      CF_ACCESS_ISSUER: ${CF_ACCESS_ISSUER}
      CF_ACCESS_AUDIENCE: ${CF_ACCESS_AUDIENCE}
      # First login by these emails is provisioned as admin.
      BOOTSTRAP_ADMIN_EMAILS: ${BOOTSTRAP_ADMIN_EMAILS}
      # In-panel "Update" button spool (host-worker half). The container drops a
      # request file here; the host panel-updater.path unit runs update.sh. The
      # feature is inert unless the matching host volume is mounted below.
      UPDATE_SPOOL_DIR: /var/run/panel-update
    # Loopback + uncommon host port (control-api is internal; exposed only for
    # local debugging / the co-located CLI).
    ports:
      - "127.0.0.1:${CONTROL_API_PUBLISH_PORT:-5431}:3001"
    # Shared spool with the host updater. UPDATE_SPOOL_HOST_DIR must be writable
    # by the container's uid (see infra/prod/install-updater.sh).
    volumes:
      - ${UPDATE_SPOOL_HOST_DIR:-/var/lib/amnezia-panel/update}:/var/run/panel-update
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12

  worker:
    <<: *app
    command: ["node", "apps/worker/dist/main.js"]
    mem_limit: ${WORKER_MEM_LIMIT:-160m}
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    <<: *app
    command: ["pnpm", "--filter", "@amnezia/web", "start"]
    mem_limit: ${WEB_MEM_LIMIT:-320m}
    environment:
      CONTROL_API_URL: http://control-api:3001
      # No dev identity: the web forwards only the real Cloudflare Access JWT.
      HOSTNAME: 0.0.0.0
      PORT: 3000
    # Loopback + uncommon host port. The Cloudflare Tunnel routes to THIS.
    ports:
      - "127.0.0.1:${WEB_PUBLISH_PORT:-5430}:3000"
    depends_on:
      control-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 3s
      retries: 12

volumes:
  postgres-data:

networks:
  panel:
